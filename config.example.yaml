# agentharness configuration.
#
# Copy to config.yaml (or point $AGENTHARNESS_CONFIG at it). Every key may also
# be overridden with an AGENTHARNESS_<KEY> environment variable, e.g.
# AGENTHARNESS_MODEL. API keys are NOT set here — they come from the provider
# SDKs' own environment variables (ANTHROPIC_API_KEY, OPENAI_API_KEY,
# GEMINI_API_KEY).

provider: anthropic          # anthropic | openai | gemini
model: claude-opus-4-8
max_tokens: 16000
effort: high                 # low | medium | high | xhigh | max (Anthropic only)
# thinking_budget: 4000      # Anthropic only: fixed thinking tokens for older
#                            # models (Haiku 4.5, Sonnet 4.5) that reject adaptive
#                            # thinking. Unset = no thinking on those. Clamped to
#                            # 1024 <= N < max_tokens. Ignored on current models.
show_thinking: false         # render model reasoning (Anthropic summary / Gemini thoughts)
max_tool_iterations: 10      # cap on tool round-trips within one turn
skills_dir: ./skills         # inside the container this is /skills (mounted)

# system_prompt: |
#   You are a helpful assistant running inside agentharness.

# Per-provider settings. base_url lets the openai provider target any
# OpenAI-compatible server (OpenAI, Ollama, vLLM, ...). Gemini here is the AI
# Studio (Developer API) path — key from GEMINI_API_KEY, no options needed.
providers:
  anthropic: {}
  openai:
    base_url: https://api.openai.com/v1
  gemini: {}
