# agentharness configuration.
#
# Copy to config.yaml (or point $AGENTHARNESS_CONFIG at it). Every key may also
# be overridden with an AGENTHARNESS_<KEY> environment variable, e.g.
# AGENTHARNESS_MODEL. API keys are NOT set here — they come from the provider
# SDKs' own environment variables (ANTHROPIC_API_KEY, OPENAI_API_KEY,
# GEMINI_API_KEY).

provider: anthropic          # anthropic | openai | gemini
model: claude-opus-4-8
max_tokens: 16000
effort: high                 # low | medium | high | xhigh | max (Anthropic only)
# thinking_budget: 4000      # Anthropic only: fixed thinking tokens for older
#                            # models (Haiku 4.5, Sonnet 4.5) that reject adaptive
#                            # thinking. Unset = no thinking on those. Clamped to
#                            # 1024 <= N < max_tokens. Ignored on current models.
show_thinking: false         # render model reasoning (Anthropic summary / Gemini thoughts)
show_usage: true             # one dim token line after each turn; /usage still
                             # shows the running total either way
max_tool_iterations: 10      # cap on tool round-trips within one turn
max_concurrency: 8           # tool calls from one assistant message that run at
                             # once — four spawn_subagent calls cost one round
                             # trip, not four. Set 1 for sequential dispatch.
max_jobs: 4                  # background turns at once (a prompt ending in `&`);
                             # still one in-flight turn per state
skills_dir: ./skills         # inside the container this is /skills (mounted, read-only)
workspace_dir: ./workspace   # inside the container this is /workspace (mounted, read-write)
workspace_writable: true     # false registers only list_dir/read_file — the write
                             # tools are not advertised to the model at all

# Skill scripts: whether the model may RUN a .py file bundled under a loaded
# skill's scripts/ directory (never code it wrote itself — the workspace is not
# executable). Off by default: with `enabled: false` the run_skill_script tool
# is not registered at all, so the model is never offered it.
skill_scripts:
  enabled: false             # AGENTHARNESS_SKILL_SCRIPTS_ENABLED=true also flips this
  default_timeout: 30        # seconds, when the model names none
  max_timeout: 120           # a model-supplied timeout is clamped to this
  max_output_bytes: 65536    # per stream; the rest is truncated with a marker
  # A script's environment is built from empty — no API key reaches it. A skill
  # asks for variables in its frontmatter (`metadata.env`); it gets only those
  # also named here. Both halves are required, so a downloaded skill cannot help
  # itself to a token by asking.
  env_allowlist: []

# system_prompt: |
#   You are a helpful assistant running inside agentharness.

# Per-provider settings, and the registry of providers you can select with
# `provider:` above or `/new --provider`.
#
# The three built-in names (anthropic, openai, gemini) need no `type`. Any other
# key here is an ALIAS: give it a `type` naming the adapter to use. Aliases are
# how you reach a second endpoint of the same protocol — the built-in `openai`
# name has exactly one base_url.
#
# Keys still never live in this file. A built-in's SDK reads its own env var; an
# alias names the variable to read with `api_key_env`. An endpoint with a
# base_url and no key either way is treated as a keyless local server.
providers:
  anthropic: {}
  openai:
    base_url: https://api.openai.com/v1
  gemini: {}

  # A local server (LM Studio, Ollama, vLLM ...) — no key needed.
  # lmstudio:
  #   type: openai
  #   base_url: http://host.containers.internal:1234/v1

  # A hosted OpenAI-compatible service — key read from the named env var.
  # together:
  #   type: openai
  #   base_url: https://api.together.xyz/v1
  #   api_key_env: TOGETHER_API_KEY

  # An endpoint serving exactly one model: declare it, and `--provider llama-70b`
  # is enough — no need to repeat the model. A provider's own `model:` beats the
  # top-level one above, which is the fallback for providers that declare none.
  # llama-70b:
  #   type: openai
  #   base_url: https://llama-70b.corp.example/v1
  #   api_key_env: LLAMA70B_API_KEY
  #   model: meta-llama/Llama-3.3-70B-Instruct

  # Claude models through Google Vertex AI. Same Messages API, so the anthropic
  # adapter is reused — but there is NO api key: it authenticates with Google
  # Application Default Credentials (`gcloud auth application-default login`).
  # Omit project_id/region to read ANTHROPIC_VERTEX_PROJECT_ID and
  # CLOUD_ML_REGION from the environment instead. /models does not work on
  # Vertex (it serves no Models API) — name the model above.
  # vertex:
  #   type: vertex
  #   project_id: my-gcp-project
  #   region: global

# MCP servers to connect to. Each entry's tools are registered as
# mcp__<server>__<tool> and become ordinary harness tools.
#
# Keys never live in this file here either: token_env names the variable
# holding a bearer token, ${VAR} in a header value is an environment lookup,
# and env_pass names the EXTRA variables a stdio subprocess gets on top of the
# small safe set it inherits (PATH, HOME, SHELL, TERM, USER, LOGNAME). Nothing
# else reaches it.
#
# Note that a stdio server is arbitrary local command execution declared in a
# config file — that is what the transport is. The container image has no npx
# or uvx, so stdio servers there need a runtime added to the image; http is the
# container-native transport.
mcp_servers: {}

# Examples — uncomment and replace the `{}` above.
#
  # A local server, run as a subprocess.
  # fs:
  #   type: stdio
  #   command: uvx
  #   args: [mcp-server-filesystem, /workspace]
  #   env_pass: [HOME]
  #   cwd: /workspace          # optional working directory

  # A remote server with a static token.
  # github:
  #   type: http
  #   url: https://api.githubcopilot.com/mcp/
  #   token_env: GITHUB_MCP_TOKEN
  #   tools: [create_issue, search_code]   # optional allowlist
  #   timeout: 15                          # seconds; default 15
  #   enabled: true                        # false keeps the entry, skips it

  # A remote server behind OAuth 2.1. Host only: it needs a browser and a
  # writable config directory, so in the container it is refused with a message
  # pointing at token_env. Tokens are cached 0600 under $XDG_CONFIG_HOME.
  # internal:
  #   type: http
  #   url: https://mcp.corp.example/mcp
  #   auth: oauth
  #   callback_port: 8765      # 0 (default) picks a free port
  #   oauth_timeout: 300       # how long you have to finish in the browser
  #   headers:
  #     X-Tenant: ${CORP_TENANT}
